<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <title>UMSR v2.0</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">⚠️ Sin conexión - Modo offline activo</div>
  <header>
    <h1>🔧 UMSR - Gestión de Instalaciones</h1>
  </header>
  <nav>
    <button class="active" onclick="showView('recepcion')">📥 Recepción</button>
    <button onclick="showView('instalaciones')">📋 Instalaciones</button>
    <button onclick="showView('despacho')">🚚 Despacho</button>
    <button onclick="showView('config')">⚙️ Configurar</button>
  </nav>
  <main>
    <!-- RECEPCIÓN -->
    <section id="view-recepcion" class="view active">
      <div class="card">
        <h2>Recepción de Equipos (Escaneo masivo)</h2>
        <div class="scanner-box" id="reader"></div>
        <button class="btn" onclick="toggleScanner()">📷 Escanear Serial PON</button>
        <label>Seriales escaneados (<span id="scanCount">0</span>)</label>
        <textarea id="scannedList" rows="4" placeholder="VSOL12345678,AX30-H..."></textarea>
        <label>Entrega</label><input type="text" id="recEntrega" placeholder="Nombre quien entrega">
        <label>Recibe</label><input type="text" id="recRecibe" placeholder="Nombre quien recibe">
        <label>Observaciones</label><input type="text" id="recObs" placeholder="Opcional">
        <button class="btn success" onclick="enviarRecepcion()">Guardar Recepción</button>
      </div>
    </section>

    <!-- INSTALACIONES -->
    <section id="view-instalaciones" class="view">
      <div class="card">
        <h2>Instalaciones Pendientes</h2>
        <button class="btn" onclick="cargarPendientes()">🔄 Actualizar</button>
        <div id="listaPendientes" style="margin-top:1rem"></div>
      </div>
    </section>

    <!-- DESPACHO -->
    <section id="view-despacho" class="view">
      <div class="card">
        <h2>Despacho en Ruta</h2>
        <label>IDs de Instalación (separados por coma)</label>
        <textarea id="despIds" rows="3" placeholder="INS_001, INS_002..."></textarea>
        <label>Instalador</label><input type="text" id="despInstalador" placeholder="Nombre técnico">
        <button class="btn success" onclick="enviarDespacho()">Despachar Equipos</button>
      </div>
    </section>

    <!-- CONFIGURACIÓN -->
    <section id="view-config" class="view">
      <div class="card">
        <h2>Configurar Instalación</h2>
        <label>ID Instalación</label><input type="text" id="cfgId" placeholder="INS_001">
        <label>Serial ONU</label><input type="text" id="cfgSerial" placeholder="VSOL12345678">
        <label>PPPoE</label><input type="text" id="cfgPppoe" placeholder="usuario@ejemplo">
        <label>Modelo</label>
        <select id="cfgModelo">
          <option value="">Seleccionar...</option>
          <option value="AX30-H">AX30-H</option>
          <option value="V2801S-B">V2801S-B</option>
          <option value="AC1200">AC1200</option>
        </select>
        <label>Configurado por</label><input type="text" id="cfgPor" placeholder="Técnico">
        <button class="btn success" onclick="enviarConfig()">Guardar Configuración</button>
      </div>
      <div class="card">
        <h2>Marcar como Instalado</h2>
        <label>ID Instalación</label><input type="text" id="instId" placeholder="INS_001">
        <button class="btn success" onclick="marcarInstalado()">✅ Confirmar Instalación</button>
      </div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
